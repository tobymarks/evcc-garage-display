; EVCC-Garagendisplay für das Guition ESP32-4848S040C (ESP32-S3, 4" 480x480, ST7701S, GT911)
; Der CYD-Stand liegt im Git-Tag "cyd-final".

[platformio]
default_envs = panel

[env]
; pioarduino = Arduino 3.x auf ESP-IDF 5 – nötig für den RGB-Treiber mit Bounce-Buffern
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_deps =
  lvgl/lvgl@~9.2.2
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
; Gegen Flackern/Verschieben des Bildes bei WLAN-Last und Flash-Zugriffen:
; Code und Konstanten aus dem PSRAM ausführen und den RGB-Interrupt IRAM-sicher machen,
; damit die Bildausgabe auch bei gesperrtem Flash-Cache weiterläuft.
custom_sdkconfig =
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  # CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y

[env:panel]

; Update übers WLAN, sobald die Firmware einmal per USB drauf ist
[env:panel_ota]
upload_protocol = espota
upload_port = evcc-garage.local
