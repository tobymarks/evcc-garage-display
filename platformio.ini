; EVCC-Garagendisplay für das ESP32 "Cheap Yellow Display" (ESP32-2432S028R)

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Der CH340-Wandler der CYD verliert bei 921600 Baud Daten
upload_speed = 460800
; 2 × 1,9 MB App-Partition, damit OTA-Updates Platz haben
board_build.partitions = min_spiffs.csv
lib_deps =
  lvgl/lvgl@~9.2.2
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DCORE_DEBUG_LEVEL=1

; Standard-CYD mit ILI9341 (ein Micro-USB-Anschluss)
[env:cyd]
build_flags = ${env.build_flags} -DCYD_PANEL_ILI9341

; CYD-Variante mit ST7789 (zwei USB-Anschlüsse: Micro-USB + USB-C)
[env:cyd2usb]
build_flags = ${env.build_flags} -DCYD_PANEL_ST7789

; Update übers WLAN, sobald die Firmware einmal per USB drauf ist
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = evcc-garage.local
